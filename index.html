<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030d06" />
    <!-- V3 theme: applied before first paint so the page never flashes the wrong theme -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('techtivai-theme');
          var mode = m === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="description" content="TechtivAI — AI-powered automation, intelligent agents, and digital experiences designed to move your business forward." />
    <title>TechtivAI — V3</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
